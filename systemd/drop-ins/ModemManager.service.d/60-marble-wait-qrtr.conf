# marble: ModemManager probes QRTR once at startup. If it starts before the
# modem has published its QMI services, the qcom-soc plugin finds only the
# rmnet port and reports "No modems were found" until ModemManager is
# restarted. Wait (at most 90 s) for the Wireless Data Service on QRTR.
[Unit]
After=rmtfs.service tqftpserv.service
Wants=rmtfs.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 90); do qrtr-lookup 2>/dev/null | grep -q "Wireless Data Service" && exit 0; sleep 1; done; exit 0'
